<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      class="lexis-pref-root">
  <html:section class="lexis-pref-panel">
    <html:div class="lexis-pref-heading">
      <html:div>
        <html:h2>Lexis</html:h2>
      </html:div>
      <html:label class="lexis-pref-toggle">
        <html:input id="lexis-zotero-enabled" type="checkbox"/>
        <html:span>启用 PDF 高亮</html:span>
      </html:label>
    </html:div>

    <html:div class="lexis-pref-fields">
      <html:label class="lexis-pref-field">
        <html:span>地址</html:span>
        <html:input id="lexis-zotero-host" type="text" spellcheck="false"/>
      </html:label>
      <html:label class="lexis-pref-field">
        <html:span>端口</html:span>
        <html:input id="lexis-zotero-port" type="number" min="1" max="65535"/>
      </html:label>
      <html:label class="lexis-pref-field">
        <html:span>令牌</html:span>
        <html:input id="lexis-zotero-token" type="password" autocomplete="off"/>
      </html:label>
      <html:label class="lexis-pref-field">
        <html:span>同步间隔（分钟）</html:span>
        <html:input id="lexis-zotero-sync" type="number" min="1" max="60"/>
      </html:label>
    </html:div>

    <html:div class="lexis-pref-actions">
      <html:button id="lexis-zotero-sync-now" type="button" class="primary">同步</html:button>
      <html:button id="lexis-zotero-test" type="button">测试</html:button>
    </html:div>
    <html:p id="lexis-zotero-status" class="lexis-pref-status" role="status" aria-live="polite">未连接</html:p>
  </html:section>

  <html:section class="lexis-pref-panel lexis-pref-files-panel">
    <html:div class="lexis-pref-heading">
      <html:div>
        <html:h2>词典高亮</html:h2>
        <html:p>仅影响 Zotero。</html:p>
      </html:div>
    </html:div>
    <html:div id="lexis-zotero-dicts" class="lexis-pref-filelist"></html:div>
  </html:section>

  <html:p class="lexis-pref-footnote">需打开 Obsidian，并启用 Lexis 桥接。</html:p>
</vbox>
